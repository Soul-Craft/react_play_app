# Always the newest: each ecosystem is checked daily. CI's dependabot-merge job merges every update once the build passes.
version: 2
updates:
  # Minor and patch bumps arrive together in one pull request; each major comes on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to full commit SHAs (the version is the comment beside each); all bumps in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
